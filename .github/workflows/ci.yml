name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: books_db
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      TEST_DATABASE_URL: postgresql+asyncpg://books_user:books_password@127.0.0.1:5432/books_db
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: books_db
          POSTGRES_USER: books_user
          POSTGRES_PASSWORD: books_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U books_user -d books_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply migrations
        run: alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
