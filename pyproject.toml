[project]
name = "books-fastapi-service"
version = "0.1.0"
description = "Minimal FastAPI project bootstrap for the test task"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "fastapi==0.116.1",
    "greenlet==3.2.4",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
