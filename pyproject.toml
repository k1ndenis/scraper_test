[project]
name = "books-fastapi-service"
version = "0.1.0"
description = "Minimal FastAPI project bootstrap for the test task"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "beautifulsoup4==4.12.3",
    "fastapi==0.116.1",
    "greenlet==3.2.4",
    "httpx==0.28.1",
    "lxml==5.3.0",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
target-version = "py312"

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.db", "app.repositories", "app.scraper"]
